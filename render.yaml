services:
  - type: web
    name: smart-audit-pipeline
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_WORKER_INTERVAL_MS
        value: "1000"
      - key: AI_PROVIDER
        value: mock
      - key: VECTOR_SEARCH_INDEX_NAME
        value: audit-entry-vector-index
      - key: MONGODB_URI
        sync: false
